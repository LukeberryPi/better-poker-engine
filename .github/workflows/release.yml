name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tag on main that names the package version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          test "$GITHUB_REF_NAME" = "v$(jq -r .version packages/better-poker-engine/package.json)"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run check
      - working-directory: packages/better-poker-engine
        run: |
          mkdir -p "$RUNNER_TEMP/tarball"
          npm pack --pack-destination "$RUNNER_TEMP/tarball"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: ${{ runner.temp }}/tarball/*.tgz
          if-no-files-found: error

  stage:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
      # Live only once a maintainer approves it with 2FA:
      # https://docs.npmjs.com/staged-publishing
      - run: npm stage publish ./*.tgz
